name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Environment
        run: |
          flutter doctor -v

      - name: Install Dependencies
        run: |
          flutter pub get
          chmod +x android/gradlew || true

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Building Release APK..."
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "Building Debug APK..."
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Rename APKs with Version & Timestamp
        run: |
          mkdir -p output-apks
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk output-apks/WaltonTVRemote-release-${TIMESTAMP}.apk
            cp build/app/outputs/flutter-apk/app-release.apk output-apks/WaltonTVRemote-release-latest.apk
          fi
          
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk output-apks/WaltonTVRemote-debug-${TIMESTAMP}.apk
            cp build/app/outputs/flutter-apk/app-debug.apk output-apks/WaltonTVRemote-debug-latest.apk
          fi
          
          ls -la output-apks/

      - name: Generate Build Summary
        run: |
          echo "### 📱 Walton TV Remote - APK Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for file in output-apks/*.apk; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              filesize=$(ls -lh "$file" | awk '{print $5}')
              echo "| **$filename** | $filesize |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Download your APK:** Go to the bottom of this page in the **Artifacts** section and download **Walton-TV-Remote-APKs.zip**." >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Walton-TV-Remote-APKs
          path: output-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            Automated build for Walton TV Remote.
            - Offline & Ad-Free
            - 38 kHz NEC True LSB
          draft: false
          prerelease: false
